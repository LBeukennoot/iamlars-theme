name: Build and Create Theme Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Set Release Version
        run: |
          # Strip leading 'v' from tag (e.g. v1.1.2 -> 1.1.2)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Detected release version: $VERSION"

          # 1. Update version in package.json (without creating a git tag)
          yarn version --new-version "$VERSION" --no-git-tag-version

          # 2. Update Version header in style.css (required by WordPress & PUC for themes)
          if [ -f style.css ]; then
            sed -i -E "s/^([[:space:]]*\*?[[:space:]]*Version:[[:space:]]*).*/\1$VERSION/" style.css
          fi

          # 3. Update version in functions.php (handles Version: header or define('...VERSION...', '...'))
          if [ -f functions.php ]; then
            sed -i -E "s/^([[:space:]]*\*?[[:space:]]*Version:[[:space:]]*).*/\1$VERSION/" functions.php
            sed -i -E "s/(define\(\s*['\"][A-Z0-9_]*VERSION['\"]\s*,\s*['\"])[^'\"]*(['\"])/\1$VERSION\2/" functions.php
          fi

      - name: Install dependencies & Compile Theme Assets
        run: |
          yarn install --frozen-lockfile --ignore-engines
          yarn build

      - name: Bundle Production Theme ZIP
        run: |
          # 1. Clean previous build and create root theme container
          rm -rf package
          mkdir -p package/iamlars-theme

          # 2. Copy compiled assets and runtime PHP files
          cp -r dist package/iamlars-theme/
          cp -r template-parts package/iamlars-theme/
          cp -r vendor package/iamlars-theme/

          # Create the missing directory for icons
          mkdir -p package/iamlars-theme/src/assets/

          # Copy icons
          cp -r src/assets/icons package/iamlars-theme/src/assets/

          # 3. Copy top-level theme files (PHP templates, style.css, screenshot.png)
          cp *.php package/iamlars-theme/ 2>/dev/null || true
          cp style.css package/iamlars-theme/
          cp screenshot.png package/iamlars-theme/ 2>/dev/null || true

          # 4. Create release ZIP
          cd package
          zip -r ../iamlars-theme.zip iamlars-theme/
          cd ..

      - name: Create GitHub Release with Theme Asset
        uses: softprops/action-gh-release@v2
        with:
          files: iamlars-theme.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
